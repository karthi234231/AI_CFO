# Minimal properties file retained alongside application.yml.
# Spring Boot loads application.yml first and this file second, and properties win on a key
# collision. That ordering is exactly why this file states only one key: the single line below
# repeats spring.application.name from the YAML base, so the effective value is unchanged while the
# file remains a valid, independently loadable configuration source. Every other setting lives in
# the YAML file where comments can explain it.

spring.application.name=cfo