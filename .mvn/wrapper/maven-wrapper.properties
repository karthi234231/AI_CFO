# Configuration for the Maven Wrapper (mvnw / mvnw.cmd). The wrapper exists so
# that every developer and every CI runner builds this project with the same Maven
# version, instead of whatever happens to be on PATH.
#
# NOTE: this file is parsed by mvnw.cmd with ConvertFrom-StringData, which only
# understands '#' comments. XML-style comments here break the wrapper.
#
# Version of the wrapper scripts themselves (mvnw / mvnw.cmd), not of Maven.
wrapperVersion=3.3.4
# "only-script" means no maven-wrapper.jar is committed: the scripts download the
# distribution themselves. That keeps a binary out of the repository.
distributionType=only-script
# The pinned Maven distribution. 3.9.16 is deliberate - the build must not pick up a
# new Maven under a different developer or at a different time, because a different
# Maven can change plugin resolution and therefore the build result.
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
